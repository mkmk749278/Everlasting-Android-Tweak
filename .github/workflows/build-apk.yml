name: Build Android APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Exact source zip filename inside "Source code/" (e.g. "Source Code 7.1.1.zip"). Leave empty to auto-pick the latest stable.'
        required: false
        default: ''
      include_beta:
        description: 'When auto-picking the latest, include beta zips'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # needed to upload assets to a GitHub Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Pick source zip
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          INPUT='${{ github.event.inputs.source_zip }}'
          INCLUDE_BETA='${{ github.event.inputs.include_beta }}'

          if [ -n "$INPUT" ]; then
            ZIP="Source code/$INPUT"
          else
            CANDIDATES=$(ls -1 "Source code/" | grep -iE '^source ?code .*\.zip$' || true)
            if [ "$INCLUDE_BETA" != "true" ]; then
              CANDIDATES=$(printf '%s\n' "$CANDIDATES" | grep -viE 'beta' || true)
            fi
            if [ -z "$CANDIDATES" ]; then
              echo "::error::No source zips found in 'Source code/'"
              exit 1
            fi

            # Sort by the embedded version (handles mixed casing of "Source Code"/"Source code")
            CHOSEN=$(printf '%s\n' "$CANDIDATES" | awk '
              {
                v=$0
                sub(/\.zip$/,"",v)
                sub(/^[Ss]ource [Cc]ode +/,"",v)
                sub(/[[:space:]]+beta.*$/,"",v)
                printf "%s\t%s\n", v, $0
              }
            ' | sort -V -k1,1 | tail -n1 | cut -f2-)
            ZIP="Source code/$CHOSEN"
          fi

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source zip not found: $ZIP"
            ls -1 "Source code/" || true
            exit 1
          fi

          BASE=$(basename "$ZIP" .zip)
          VERSION=$(echo "$BASE" | grep -oE '[0-9]+(\.[0-9]+){1,2}([[:space:]]*beta)?' | head -1 | tr -d ' ')
          if [ -z "$VERSION" ]; then VERSION="unknown"; fi

          echo "zip=$ZIP"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Selected zip : $ZIP"
          echo "Version tag  : $VERSION"

      - name: Extract source
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-workspace
          mkdir -p build-workspace/extracted
          unzip -q "${{ steps.pick.outputs.zip }}" -d build-workspace/extracted

          # The project root is whichever directory contains the gradlew script.
          # Some zips put files at the zip root, others nest them under "Source Code X.Y.Z/".
          GRADLEW=$(find build-workspace/extracted -maxdepth 4 -type f -name gradlew | head -n1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found inside the extracted source zip"
            find build-workspace/extracted -maxdepth 3 | head -50
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW")
          echo "Detected project root: $PROJECT_ROOT"

          # Normalise to a stable, space-free path: build-workspace/project
          if [ "$PROJECT_ROOT" = "build-workspace/extracted" ]; then
            mv build-workspace/extracted build-workspace/project
          else
            mv "$PROJECT_ROOT" build-workspace/_project_inner
            rm -rf build-workspace/extracted
            mv build-workspace/_project_inner build-workspace/project
          fi

          # Sanity-check required Gradle files
          for f in gradlew settings.gradle.kts settings.gradle; do
            if [ -e "build-workspace/project/$f" ]; then
              echo "found: $f"
              FOUND_SETTINGS=1
              [ "$f" = "gradlew" ] || break
            fi
          done
          if [ ! -f build-workspace/project/gradlew ]; then
            echo "::error::Project root has no gradlew after normalisation"
            ls -la build-workspace/project
            exit 1
          fi
          if [ ! -f build-workspace/project/settings.gradle.kts ] && [ ! -f build-workspace/project/settings.gradle ]; then
            echo "::error::Project root has no settings.gradle(.kts)"
            ls -la build-workspace/project
            exit 1
          fi

          echo "project_dir=build-workspace/project" >> "$GITHUB_OUTPUT"

          echo "Project tree (top level):"
          ls -la build-workspace/project

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ steps.pick.outputs.version }}-${{ hashFiles('build-workspace/project/**/*.gradle*', 'build-workspace/project/**/gradle-wrapper.properties', 'build-workspace/project/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ steps.pick.outputs.version }}-
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x "${{ steps.extract.outputs.project_dir }}/gradlew"

      - name: Decode release keystore (if provided)
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ steps.extract.outputs.project_dir }}/release.keystore"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret provided; release APK will be signed with a debug key so it remains installable."
          fi

      - name: Build APKs (debug + release)
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign and collect APKs
        id: collect
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          PROJECT_DIR='${{ steps.extract.outputs.project_dir }}'
          VERSION='${{ steps.pick.outputs.version }}'
          OUT_DIR=build-workspace/output
          mkdir -p "$OUT_DIR"

          # Pick newest installed build-tools for apksigner / zipalign
          BT_DIR="$ANDROID_HOME/build-tools"
          if [ ! -d "$BT_DIR" ]; then
            echo "::error::Android build-tools not found at $BT_DIR"
            exit 1
          fi
          BT_VER=$(ls -1 "$BT_DIR" | sort -V | tail -n1)
          APKSIGNER="$BT_DIR/$BT_VER/apksigner"
          ZIPALIGN="$BT_DIR/$BT_VER/zipalign"
          echo "Using build-tools $BT_VER"

          # Locate produced APKs
          RELEASE_APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 2 -type f -name '*.apk' | head -n1 || true)
          DEBUG_APK=$(find   "$PROJECT_DIR/app/build/outputs/apk/debug"   -maxdepth 2 -type f -name '*.apk' | head -n1 || true)

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi

          ALIGNED="$OUT_DIR/release-aligned.apk"
          "$ZIPALIGN" -p -f 4 "$RELEASE_APK" "$ALIGNED"

          SIGNED_NAME="EverlastingAndroidTweak-${VERSION}-release.apk"
          SIGNED_PATH="$OUT_DIR/$SIGNED_NAME"

          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            "$APKSIGNER" sign \
              --ks "$PROJECT_DIR/release.keystore" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --out "$SIGNED_PATH" \
              "$ALIGNED"
            echo "Release APK signed with provided keystore."
          else
            DEBUG_KS="$HOME/.android/debug.keystore"
            mkdir -p "$HOME/.android"
            if [ ! -f "$DEBUG_KS" ]; then
              keytool -genkeypair -v \
                -keystore "$DEBUG_KS" -storepass android \
                -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            SIGNED_NAME="EverlastingAndroidTweak-${VERSION}-release-debugsigned.apk"
            SIGNED_PATH="$OUT_DIR/$SIGNED_NAME"
            "$APKSIGNER" sign \
              --ks "$DEBUG_KS" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "$SIGNED_PATH" \
              "$ALIGNED"
            echo "Release APK signed with debug key (no release keystore secret configured)."
          fi
          rm -f "$ALIGNED"

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "$OUT_DIR/EverlastingAndroidTweak-${VERSION}-debug.apk"
          fi

          # Generate SHA-256 checksums for everything we ship
          ( cd "$OUT_DIR" && sha256sum *.apk > "EverlastingAndroidTweak-${VERSION}-SHA256SUMS.txt" )

          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Output files:"
          ls -la "$OUT_DIR"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EverlastingAndroidTweak-${{ steps.pick.outputs.version }}
          path: ${{ steps.collect.outputs.out_dir }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.out_dir }}/*.apk
            ${{ steps.collect.outputs.out_dir }}/*SHA256SUMS.txt
          fail_on_unmatched_files: true
